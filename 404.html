<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Страница не найдена</title>
<style>
  :root{
    --site-color:#4a9aa8; /* Цвет кнопки */
    --bg-color:#f5f5f5;   /* Цвет фона */
  }
  *{margin:0; padding:0; box-sizing:border-box;}
  html, body {
    height: 100%;
    width: 100%;
  }
  body{
    font-family:'Segoe UI', Roboto, Arial, sans-serif;
    background-color: var(--bg-color);
    color:#2b2b2b;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content: flex-start;
    /* Убрали overflow:hidden, чтобы ничего не обрезалось на мобильных */
  }

  /* Надпись 404 */
  .code{
    position:absolute;
    top:20px;
    left:20px;
    font-size:clamp(50px, 15vw, 140px);
    font-weight:800;
    color:#333;
    line-height:1;
    z-index: 10;
  }

  /* Контейнер для картинки, чтобы она точно была видна */
  .image-container {
    width: 100%;
    flex-grow: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding-top: 60px; /* Отступ сверху под 404 */
  }

  /* Сама девушка */
  .girl{
    display: block;
    max-height: 70vh;      /* Максимум 70% высоты экрана */
    max-width: 95vw;       /* Максимум 95% ширины экрана */
    width: auto;
    height: auto;
    object-fit: contain;   /* Сохраняем пропорции */
  }

  /* Подвал с текстом и кнопкой */
  .footer{
    width: 100%;
    padding: 20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:15px;
    text-align:center;
    background: var(--bg-color); /* Фон под текстом, чтобы перекрывать низ картинки если нужно */
    z-index: 5;
  }

  .msg{
    font-size:clamp(16px, 4vw, 24px);
    font-weight:600;
    color:#5a4a3a;
  }

  .btn{
    display:inline-block;
    background:var(--site-color);
    color:#fff;
    text-decoration:none;
    padding:12px 30px;
    border-radius:40px;
    font-size:16px;
    font-weight:600;
    box-shadow:0 4px 10px rgba(0,0,0,.1);
  }

  /* Специально для мобильных - делаем картинку чуть меньше, чтобы всё влезло без скролла */
  @media (max-width: 600px) {
    .girl {
      max-height: 50vh; /* На телефоне девушка занимает половину экрана */
      width: 90vw;
    }
    .image-container {
      padding-top: 80px;
    }
  }
</style>
</head>
<body>

  <div class="code">404</div>

  <div class="image-container">
    <!-- ?v=3 заставляет телефон забыть старый кэш и скачать картинку заново -->
    <img class="girl" src="girl-404.png?v=3" alt="Девушка пожимает плечами">
  </div>

  <div class="footer">
    <p class="msg">УПС, я что-то потеряла, но скоро найду!</p>
    <a class="btn" href="/">На главную</a>
  </div>

</body>
</html>
