<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F2EE">
<title>CareShare</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top"><div class="in">

  <div class="sp"></div>
  <button class="sos" data-act="sos" aria-label="Экстренная помощь">SOS</button>

</div></header>
<main id="view"></main>
<button class="fab" id="fab" data-act="fab" aria-label="Добавить"></button>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" hidden>
<script src="core.js"></script>
<script src="views.js"></script>
<script src="sheets.js"></script>

</html>
