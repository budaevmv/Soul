name: TravelPlanner Android

on:
  push:
    paths: ["TravelPlanner/**", ".github/workflows/travel-planner-android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TravelPlanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build APK
        run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: TravelPlanner-apk
          path: TravelPlanner/app/build/outputs/apk/release/app-release.apk
